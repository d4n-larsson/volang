<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 250" role="img" aria-label="The release check's grant: git, and the report under out/, and nothing else">
  <!-- One dark panel in Nord colors, so the same file reads in the light and the dark scheme. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#88c0d0"/>
    </marker>
    <style>
      .n { fill: #434c5e; stroke: #88c0d0; stroke-width: 1.5; }
      .w { stroke: #ebcb8b; stroke-dasharray: 5 4; }
      .f { fill: none; stroke: #88c0d0; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .b { fill: #5e81ac; }
      .t { font: 700 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #eceff4; text-anchor: middle; }
      .s { font: 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d8dee9; text-anchor: middle; }
      .a { text-anchor: start; }
      .l { fill: none; stroke: #88c0d0; stroke-width: 1.5; marker-end: url(#a); }
      .k { marker-start: url(#a); }
      .d { fill: none; stroke: #88c0d0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="734" height="250" rx="10" fill="#3b4252"/>
  <rect class="n" x="60" y="95" width="180" height="60" rx="8"/>
  <text class="t" x="150" y="122">main</text>
  <text class="s" x="150" y="141">the grant of the run</text>
  <rect class="n" x="330" y="20" width="340" height="56" rx="8"/>
  <text class="t" x="500" y="45">run("git", args)</text>
  <text class="s" x="500" y="64">process("git"): exit code and output, no shell</text>
  <rect class="n w" x="330" y="97" width="340" height="56" rx="8"/>
  <text class="t" x="500" y="122">run("make", ...)</text>
  <text class="s" x="500" y="141">not granted: stops with R0010</text>
  <rect class="n" x="330" y="174" width="340" height="56" rx="8"/>
  <text class="t" x="500" y="199">out/report.txt</text>
  <text class="s" x="500" y="218">file.write("out/"), file.delete("out/")</text>
  <path class="l" d="M240 125H328"/>
  <path class="l" d="M285 125V48H328"/>
  <path class="l" d="M285 125V202H328"/>
</svg>
