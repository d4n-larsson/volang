<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 256" role="img" aria-label="The job queue: one program, three workers, and a deadline that replaces a worker">
  <!-- One dark panel in Nord colors, so the same file reads in the light and the dark scheme. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#88c0d0"/>
    </marker>
    <style>
      .n { fill: #434c5e; stroke: #88c0d0; stroke-width: 1.5; }
      .w { stroke: #ebcb8b; stroke-dasharray: 5 4; }
      .f { fill: none; stroke: #88c0d0; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .b { fill: #5e81ac; }
      .t { font: 700 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #eceff4; text-anchor: middle; }
      .s { font: 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d8dee9; text-anchor: middle; }
      .a { text-anchor: start; }
      .l { fill: none; stroke: #88c0d0; stroke-width: 1.5; marker-end: url(#a); }
      .k { marker-start: url(#a); }
      .d { fill: none; stroke: #88c0d0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="734" height="256" rx="10" fill="#3b4252"/>
  <rect class="n" x="20" y="98" width="170" height="60" rx="8"/>
  <text class="t" x="105" y="125">main.vo</text>
  <text class="s" x="105" y="144">hands out seven jobs</text>
  <rect class="n" x="470" y="20" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="45">worker</text>
  <text class="s" x="592" y="64">serve_jobs, a process of its own</text>
  <rect class="n" x="470" y="100" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="125">worker</text>
  <text class="s" x="592" y="144">serve_jobs, a process of its own</text>
  <rect class="n w" x="470" y="180" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="205">worker</text>
  <text class="s" x="592" y="224">300 ms passed: stopped, replaced</text>
  <path class="l k" d="M192 128H468"/>
  <path class="l" d="M430 128V48H468"/>
  <path class="l" d="M430 128V208H468"/>
  <text class="s" x="310" y="118">a Job goes in, a Done comes out</text>
  <text class="s" x="310" y="146">both copied, nothing shared</text>
</svg>
