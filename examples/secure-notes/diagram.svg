<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 250" role="img" aria-label="Secure notes: every request passes the rules before an operation runs">
  <!-- One dark panel in Nord colors, so the same file reads in the light and the dark scheme. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#88c0d0"/>
    </marker>
    <style>
      .n { fill: #434c5e; stroke: #88c0d0; stroke-width: 1.5; }
      .w { stroke: #ebcb8b; stroke-dasharray: 5 4; }
      .f { fill: none; stroke: #88c0d0; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .b { fill: #5e81ac; }
      .t { font: 700 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #eceff4; text-anchor: middle; }
      .s { font: 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d8dee9; text-anchor: middle; }
      .a { text-anchor: start; }
      .l { fill: none; stroke: #88c0d0; stroke-width: 1.5; marker-end: url(#a); }
      .k { marker-start: url(#a); }
      .d { fill: none; stroke: #88c0d0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="734" height="250" rx="10" fill="#3b4252"/>
  <rect class="n" x="20" y="95" width="150" height="60" rx="8"/>
  <text class="t" x="95" y="122">request</text>
  <text class="s" x="95" y="141">with or without a token</text>
  <rect class="n" x="220" y="95" width="190" height="60" rx="8"/>
  <text class="t" x="315" y="122">rules()</text>
  <text class="s" x="315" y="141">one line per route</text>
  <rect class="n w" x="470" y="20" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="45">401 Unauthorized</text>
  <text class="s" x="592" y="64">no valid token</text>
  <rect class="n w" x="470" y="97" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="122">403 Forbidden</text>
  <text class="s" x="592" y="141">signed in, but the rule says no</text>
  <rect class="n" x="470" y="174" width="244" height="56" rx="8"/>
  <text class="t" x="592" y="199">the operation</text>
  <text class="s" x="592" y="218">runs with the caller's identity</text>
  <path class="l" d="M170 125H218"/>
  <path class="l" d="M410 125H468"/>
  <path class="l" d="M440 125V48H468"/>
  <path class="l" d="M440 125V202H468"/>
</svg>
