# The quality gate (`make gate`: lint, the whole test suite, the UB-trap and collector stress suites,
# generated programs against the frozen reference builds, and the speed checks) on every push to main
# and every pull request. The gate builds its reference binaries from earlier commits, so the checkout
# takes the full history. SESI, the assembly linter, is not in this repository: its step is skipped
# here (SESI_SKIP) and stays a local check.
name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Ubuntu mirror is sometimes very slow (95 MB took 15 minutes) or stalls (one run hung for
      # three hours), so the downloaded packages are cached and apt times out and retries.
      - name: Restore the downloaded packages
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-archives-${{ hashFiles('.github/workflows/gate.yml') }}
          restore-keys: apt-archives-
      - name: Install the cross compilers and qemu
        timeout-minutes: 40
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99retry
          for i in 1 2 3; do timeout 240 sudo apt-get update -q && break; sleep 10; done
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" gcc binutils-riscv64-linux-gnu gcc-riscv64-linux-gnu gcc-aarch64-linux-gnu qemu-user vim
          sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep the downloaded packages
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-archives-${{ hashFiles('.github/workflows/gate.yml') }}
      - name: Permit user namespaces
        # tests/cases/https_steps/no_trust_store hides the machine's trust store in a user and mount
        # namespace; Ubuntu 24.04 restricts those by default (the case is skipped where it cannot run)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the grammar tools
        # only tests/grammars.py needs them; VO_GRAMMARS=require below makes a skipped grammar check fail
        run: npm ci
        working-directory: editors
      - name: Check the tools
        run: make check-tools
      - name: Run the gate
        run: make gate SESI_SKIP=1
        env:
          VO_GRAMMARS: require
      - name: Keep the programs the comparisons disagreed on
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-failures
          path: build/diff-failures
          if-no-files-found: ignore
