# The documentation site (spec 015). tools/site.py reads this file, adds the navigation and the version,
# and writes build/mkdocs.gen.yml, which `make site` builds. Paths below are relative to build/.
site_name: vo
site_description: A small, statically typed programming language for AI coding agents and the people who review their code.
site_url: https://d4n-larsson.github.io/volang/
repo_url: https://github.com/d4n-larsson/volang
repo_name: d4n-larsson/volang
edit_uri: edit/main/site/docs/
docs_dir: site-src
site_dir: site
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: ../site/overrides
  font: false # no external fonts (FR-015)
  logo: assets/vo.svg
  favicon: assets/vo.svg
  palette: # one dark scheme (docs/volang-design-brief.md): Nord in stylesheets/extra.css
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

hooks:
  - ../site/hooks.py

plugins:
  - search
  - redirects:
      redirect_maps: {} # moved pages: old address -> new page (FR-009)

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true # language-output, language-console: styled in extra.css
  - pymdownx.superfences
  - pymdownx.blocks.tab: # `/// tab | Title` ... `///`: fences stay at the line start, so examples are still checked
      alternate_style: true
  - pymdownx.blocks.html # `/// html | div.grid.cards`: the home page's cards

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
